name: CI

on:
  push:
    branches: [main, "chore/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked server dependencies
        run: npm ci --no-audit --no-fund
      - name: Check server JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js' | grep '^server/')
      - name: Run server unit tests
        run: npm test

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # The committed mobile lockfile is currently out of sync with package.json.
      # npm install reconciles it in the CI workspace; commit the regenerated lockfile
      # in a follow-up before switching this step to npm ci.
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo package compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor@latest
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Export Android bundle
        run: npx expo export --platform android
